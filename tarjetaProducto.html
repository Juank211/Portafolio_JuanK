<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta de Producto</title>
    <link rel="stylesheet" href="estiloProducto.css"
</head>
<body>
    <div class="card-container">
        <div class="product-card">
            <div class="product-image">
                <div class="contenedor-img"><img src="IMG_9920.jpeg" alt="MacBook Air 2020">
   </div>
            </div>
            <div class="product-info">
                <h3 class="product-title">MacBook Air 2020</h3>
                <p class="product-description">Procesador Intel i3 de doble nucleo, 8GB de RAM, 256GB de almacenamiento, pantalla retina de 13"</p>
                <div class="product-prize">$2.000.000</div>
                <button class="buy-button">Comprar!!!</button> </button>
            </div>
        </div>
    </div>
    
</body>
</html>
