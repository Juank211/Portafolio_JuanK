<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Product Card</title>
    <link rel="stylesheet" href="estiloProducto.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="product-card">
        <img class="product-image" src="IMG_9920.jpeg" alt="MacBook Air 2020">
        <div class="product-content">
            <h1 class="product-title">MacBook Air 2020</h1>
            <p class="product-description">
                Elevate your workflow with the iconic thin and light design.
                Features an Intel i3 processor, 8GB RAM, and a stunning 13" Retina display.
            </p>
            <div class="product-price">$2.000.000</div>
            <button class="buy-button">Añadir al carrito</button>
        </div>
    </div>
</body>

</html>
